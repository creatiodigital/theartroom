<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Take a peek video modal, phone</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Lato:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141414}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.serif{font-family:'EB Garamond',Georgia,serif}
.caps{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.ib{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib:focus-visible,.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="What arrives at your door" style="width: 390px; height: 844px; position: relative; background: #141414; font-family: Lato, -apple-system, sans-serif; color: #fff; display: flex; flex-direction: column">

<div style="height: 72px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px">
<a class="ib" href="PhoneSection.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M204.24,195.76a6,6,0,1,1-8.48,8.48L128,136.49,60.24,204.24a6,6,0,0,1-8.48-8.48L119.51,128,51.76,60.24a6,6,0,0,1,8.48-8.48L128,119.51l67.76-67.75a6,6,0,0,1,8.48,8.48L136.49,128Z"></path></svg></a>
</div>

<div style="position: relative; width: 390px; height: 488px; overflow: hidden; background: #2a2a2a">
<img src="/_blob/d54fe27e8b616b6da810b9fe654dbe36" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 12px; display: flex; align-items: center; gap: 12px">
<button class="ib" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.45); color: #fff">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="margin-left: 2px"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"></path></svg></sc-if>
</button>
<span style="flex: 1 1 auto; height: 2px; background: rgba(255,255,255,0.35); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; background: #fff"></span></span>
</div>
</div>

<div style="flex: 1 1 auto; padding: 22px 20px 30px; display: flex; flex-direction: column; gap: 8px">
<span class="caps" style="color: #a8a8a8">Take a peek</span>
<span class="serif" style="font-size: 26px; line-height: 1.15">What arrives at your door</span>
<span style="font-size: 14px; line-height: 1.6; color: #bdbdbd">Sent flat, wrapped in tissue and sealed. Archival fine-art paper, approved by the artist, with a certificate of authenticity.</span>
<a class="cta" href="#" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border: 1px solid #fff; color: #fff; font-size: 12px; letter-spacing: .12em; text-transform: uppercase">Discover the prints</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: true }; }
  renderVals() {
    const playing = this.state.playing;
    return {
      playing: playing,
      paused: !playing,
      playLabel: playing ? 'Pause' : 'Play',
      toggle: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
