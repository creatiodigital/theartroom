<div style="height: 760px; background: #f2f2f2; display: flex; align-items: center; justify-content: center">
<img src="/_blob/1e01fdbae57cb4173120117d6a7e0f3c" alt="Memoria I, Beatriz Salvatierra, as a framed print" style="max-width: 78%; max-height: 78%; display: block">

<div style="display: flex; flex-direction: column; gap: 18px">

<span style="font-size: 13px; color: #444; font-weight: 700">2024</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1px solid #e4e4e4"><span class="serif" style="font-size: 26px">€284</span><span style="font-size: 12px; color: #2f7d4a">● Available</span></div>

<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">Take a peek</span><span style="font-size: 12px; color: #666">What arrives at your door · 0:21</span></span>

<div style="display: flex; flex-direction: column; border-top: 1px solid #e4e4e4; margin-top: 4px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="border-bottom: 1px solid #e4e4e4">
<h2 style="margin: 0; font-size: inherit; font-weight: inherit">
<button class="row" onClick="{{r.toggle}}" aria-expanded="{{r.expanded}}" aria-controls="{{r.panelId}}">
<span class="caps" style="font-size: 12px; letter-spacing: .12em; color: #1a1a1a">{{r.label}}</span>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 256 256" fill="#1a1a1a" aria-hidden="true"><path d="M222,128a6,6,0,0,1-6,6H40a6,6,0,0,1,0-12H216A6,6,0,0,1,222,128Z"></path></svg></sc-if>
<sc-if value="{{r.closed}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 256 256" fill="#1a1a1a" aria-hidden="true"><path d="M222,128a6,6,0,0,1-6,6H134v82a6,6,0,0,1-12,0V134H40a6,6,0,0,1,0-12h82V40a6,6,0,0,1,12,0v82h82A6,6,0,0,1,222,128Z"></path></svg></sc-if>
</button>
</h2>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
<div class="body" id="{{r.panelId}}" style="padding: 0 0 18px; font-size: 14px; line-height: 1.65; color: #444; display: flex; flex-direction: column; gap: 10px">

<sc-if value="{{r.hasLink}}" hint-placeholder-val="{{ false }}"><a href="#" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #333"><svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M220.24,132.24l-72,72a6,6,0,0,1-8.48-8.48L201.51,134H40a6,6,0,0,1,0-12H201.51L139.76,60.24a6,6,0,0,1,8.48-8.48l72,72A6,6,0,0,1,220.24,132.24Z"></path></svg>{{r.link}}</a></sc-if>
</div>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 22px; margin-top: 2px">
<span class="caps" style="color: #666">Share</span>
<a href="#" aria-label="Share on WhatsApp" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; letter-spacing: .03em; color: #333"><svg width="16" height="16" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><path d="M15 7.30704C15 11.3423 11.7033 14.6136 7.63573 14.6136C6.34493 14.6136 5.13239 14.2834 4.07686 13.7053L0 15L1.32895 11.0787C0.658852 9.97815 0.272932 8.68588 0.272932 7.30655C0.273421 3.27127 3.56915 0 7.63671 0C11.7038 0.00097825 15 3.27176 15 7.30704ZM7.63524 1.1651C4.22164 1.1651 1.44488 3.92083 1.44488 7.30851C1.44488 8.65262 1.88313 9.89696 2.62416 10.9094L1.85134 13.1902L4.22947 12.4345C5.20772 13.0763 6.37819 13.45 7.63524 13.45C11.0488 13.45 13.8266 10.6947 13.8266 7.30704C13.8276 3.92083 11.0493 1.1651 7.63524 1.1651Z"></path></svg>WhatsApp</a>
<a href="#" aria-label="Share by email" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; letter-spacing: .03em; color: #333"><svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,50H32a6,6,0,0,0-6,6V192a14,14,0,0,0,14,14H216a14,14,0,0,0,14-14V56A6,6,0,0,0,224,50ZM208.58,62,128,135.86,47.42,62ZM216,194H40a2,2,0,0,1-2-2V69.64l86,78.84a6,6,0,0,0,8.1,0L218,69.64V192A2,2,0,0,1,216,194Z"></path></svg>Email</a>
</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 0 }; }
  renderVals() {
    const data = [
      { label: 'What’s in the box', paras: [
        'Your print on archival fine-art paper. Unframed prints travel flat between card, wrapped in tissue and sealed.',
        'Limited editions: a certificate of authenticity with the same number as the print and the artist’s printed signature.',
        'Open editions: a personal letter from the gallery.',
        'The frame and passepartout, if you chose them.'
      ] },
      { label: 'Production time', paras: [
        'Every print is made to order, just for you, by our fine-art print partner. It usually ships within 2 weeks of your order.',
        'You get an email with tracking as soon as it ships.'
      ] },
      { label: 'Shipping', paras: [
        'Shipped with tracking from the UK, Germany or the US, to 38 countries: the EU, the UK, Switzerland, Norway, Iceland, Liechtenstein, the US, Canada, Australia, New Zealand, Japan and South Korea.',
        'The shipping cost and the delivery estimate for your address are shown at checkout, before you pay. Outside the EU, the UK and the US, import duties may apply on delivery.'
      ] },
      { label: 'Returns', paras: [
        'If your print arrives damaged, faulty or not what you ordered, write to us within 7 days of delivery with a few photos, and we’ll replace it or refund you.',
        'Because each print is made for you, we can’t take it back for a change of mind. You can cancel free of charge until production starts.'
      ], link: 'Online terms of sale' }
    ];
    const open = this.state.open;
    return {
      rows: data.map((d, i) => ({
        label: d.label,
        paras: d.paras,
        link: d.link || '',
        hasLink: !!d.link,
        open: open === i,
        closed: open !== i,
        expanded: open === i ? 'true' : 'false',
        panelId: 'faq-panel-' + i,
        toggle: () => this.setState({ open: open === i ? -1 : i })
      }))
    };
  }
}
</script>
</body>
</html>
