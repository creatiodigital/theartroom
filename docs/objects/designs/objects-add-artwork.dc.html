<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add artwork</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 760px; height: 760px; box-sizing: border-box; background: rgba(20,20,20,0.45); display: flex; align-items: center; justify-content: center; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; color: #333333">
<div role="dialog" aria-modal="true" aria-labelledby="add-h" style="width: 600px; box-sizing: border-box; background: #ffffff; border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column">
<div style="padding: 24px 24px 0; display: flex; flex-direction: column; gap: 20px">
<h2 id="add-h" style="margin: 0; font-size: 20px; font-weight: 700; color: #000000">Add artwork</h2>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #555555">Title</span><input value="Torso II" style="font: inherit; font-size: 14px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #dcdcdc; border-radius: 4px"><span style="font-size: 12px; color: #666666">Give your artwork a name. You can change this later. Leave empty to auto-generate a title.</span></label>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: #555555">Type</legend>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="5">
<label style="{{t.card}}">
<input type="radio" name="type" value="{{t.value}}" checked="{{t.on}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<svg width="24" height="24" viewBox="0 0 256 256" fill="{{t.fill}}" stroke="{{t.stroke}}" stroke-width="12" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 13px; font-weight: 600">{{t.label}}</span>
</label>
</sc-for>
</div>
<div style="display: flex; gap: 12px; padding: 14px 16px; background: #f6f4f0; border-radius: 8px">
<span aria-hidden="true" style="width: 56px; height: 56px; flex: 0 0 auto; border-radius: 4px; background: #ece9e3; display: flex; align-items: flex-end; justify-content: center"><svg width="30" height="48" viewBox="0 0 60 100"><path d="M14 96 C6 70 14 40 22 26 C14 14 22 2 30 2 C38 2 46 14 38 26 C46 40 54 70 46 96 Z" fill="#6f685f"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<span style="font-weight: 600; color: #000000">Object: a sculpture or any piece with volume</span>
<span style="color: #555555">You add a cover photo, more photos and reels, and the details. It shows in your exhibitions like any other artwork.</span>
<span style="color: #555555">Want it in the 3D room too? We turn it into a 3D model for you. You can ask for that later.</span>
</div>
</div>
</fieldset>
</div>
<div style="margin-top: 24px; padding: 16px 24px; border-top: 1px solid #eaeaea; display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 36px; background: #ffffff; border: 1px solid #dcdcdc; border-radius: 4px">Cancel</button>
<a href="ObjectEditor.dc.html" style="display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; padding: 8px 16px; min-height: 36px; box-sizing: border-box; background: #1a1a1a; color: #ffffff; border-radius: 4px; text-decoration: none">Create artwork</a>
</div>
</div>
</div>
</x-dc>

      ['Sound', 'sound', 'M154.64,26.61a6,6,0,0,0-6.32.65L77.94,82H32A14,14,0,0,0,18,96v64a14,14,0,0,0,14,14H77.94l70.38,54.74A6,6,0,0,0,158,224V32A6,6,0,0,0,154.64,26.61ZM30,160V96a2,2,0,0,1,2-2H74v68H32A2,2,0,0,1,30,160Zm116,51.73L86,165.07V90.93l60-46.66Z', false],

        card: { position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '6px', height: '84px', borderRadius: '6px', border: on ? '2px solid #1a1a1a' : '1px solid #dcdcdc', background: on ? '#fafafa' : '#ffffff', color: on ? '#000000' : '#444444', cursor: 'pointer', boxSizing: 'border-box' } }))
    };
  }
}
</script>
</body>
</html>
