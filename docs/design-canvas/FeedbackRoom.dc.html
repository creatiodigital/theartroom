<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;family=EB+Garamond:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#333333}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: Lato, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.6; color: #333333; background: #ece8e1">

<!-- Placeholder for the 3D room -->
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="flex: 1 1 64%; background: #efebe4; display: flex; align-items: center; justify-content: center; gap: 120px; padding-top: 40px">
<div style="width: 220px; height: 280px; background: #f7f4ee; box-shadow: 0 0 0 10px #4a4038, 0 18px 30px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center"><div style="width: 160px; height: 210px; background: #c9b8a0"></div></div>
<div style="width: 300px; height: 220px; background: #f7f4ee; box-shadow: 0 0 0 10px #4a4038, 0 18px 30px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center"><div style="width: 240px; height: 160px; background: #6f7d72"></div></div>
<div style="width: 200px; height: 260px; background: #f7f4ee; box-shadow: 0 0 0 10px #4a4038, 0 18px 30px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center"><div style="width: 140px; height: 190px; background: #a8574a"></div></div>
</div>
<div style="flex: 1 1 36%; background: #d6cfc3; border-top: 1px solid #c8c0b2"></div>
<span style="position: absolute; left: 24px; bottom: 24px; font-size: 12px; color: #6b655c; letter-spacing: 0.08em; text-transform: uppercase">3D room (placeholder)</span>
</div>

<!-- Existing control: leave (top right) -->
<button type="button" aria-label="Leave Exhibition" style="position: absolute; top: 24px; right: 24px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; background: rgba(255,255,255,0.6); border: 0; border-radius: 6px; cursor: pointer; color: #000000"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>

<!-- Bottom-right controls: NEW feedback + existing help -->
<div style="position: absolute; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{open}}" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(255,255,255,0.6); border: 0; border-radius: 6px; cursor: pointer; color: #000000; font: inherit; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"></path><path d="M7 11h10"></path><path d="M7 15h6"></path><path d="M7 7h8"></path></svg>Feedback</button>
<button type="button" aria-label="Navigation help" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding: 0; background: rgba(255,255,255,0.6); border: 0; border-radius: 6px; cursor: pointer; color: #000000"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="7"></rect><path d="M12 6v4"></path></svg></button>
</div>

<!-- Feedback panel -->
<sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="fbt" style="position: relative; width: 440px; max-height: 860px; overflow: auto; box-sizing: border-box; background: rgba(255,255,255,0.96); backdrop-filter: blur(8px); border-radius: 8px; padding: 32px">

<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer; color: #333333"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>

<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<form style="display: flex; flex-direction: column; gap: 22px; margin: 0">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<img src="/_blob/0542d57120db5bde654e71aaf0d4e13b" alt="" style="width: 36px; height: auto">
<h2 id="fbt" style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.2; color: #333333">Share your thoughts</h2>
<p style="margin: 0; font-size: 15px; color: #666666">Tell us anything about the website or the 3D rooms. No names, no sign-up, just your thoughts.</p>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your feedback</span>
<textarea rows="6" maxlength="2000" onInput="{{onText}}" placeholder="What did you love? What could be better?" style="font: inherit; font-size: 15px; padding: 12px; border: 1px solid #dcdcdc; border-radius: 0; background: #ffffff; resize: vertical"></textarea>
</label>

<button type="button" onClick="{{send}}" disabled="{{cannotSend}}" style="{{sendStyle}}">Send</button>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #666666; text-align: center">To help us fix problems we include your device type and browser, never who you are.</p>
</form>
</sc-if>

<sc-if value="{{isThanks}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 24px 8px 8px">
<img src="/_blob/0542d57120db5bde654e71aaf0d4e13b" alt="" style="width: 36px; height: auto">
<h2 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.2">Thank you</h2>
<p style="margin: 0; color: #666666; max-width: 320px">Your note goes straight to the gallery. We read every one.</p>
<button type="button" onClick="{{close}}" style="margin-top: 12px; width: 100%; font: inherit; font-size: 14px; padding: 12px 16px; min-height: 44px; background: #ffffff; color: #333333; border: 1px solid #dcdcdc; border-radius: 0; cursor: pointer">Close</button>
</div>
</sc-if>

</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, sent: false, text: '' };
  }
  renderVals() {
    const st = this.state;
    const canSend = st.text.trim().length > 0;
    return {
      isOpen: st.open,
      isForm: !st.sent,
      isThanks: st.sent,
      onText: (e) => this.setState({ text: e.target.value }),
      open: () => this.setState({ open: true, sent: false, text: '' }),
      close: () => this.setState({ open: false }),
      send: () => { if (canSend) this.setState({ sent: true }); },
      cannotSend: !canSend,
      sendStyle: { width: '100%', font: 'inherit', fontSize: '14px', padding: '12px 16px', minHeight: '44px', background: canSend ? '#000000' : '#d0d0d0', color: canSend ? '#ffffff' : '#666666', border: '1px solid ' + (canSend ? '#000000' : '#d0d0d0'), borderRadius: 0, cursor: canSend ? 'pointer' : 'not-allowed' }
    };
  }
}
</script>
</body>
</html>
