<helmet>

<style>
body{margin:0;background:#d6d6d6}
.mb{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.96);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.05);color:#1a1a1a;padding:0}
.mb.open{background:#1a1a1a;color:#fff}
.menu{position:absolute;width:244px;padding:6px;background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:9px;font-size:15px;color:#1a1a1a}
.it svg{flex:0 0 auto}
.sw{margin-left:auto;width:34px;height:20px;border-radius:10px;background:#1a1a1a;position:relative}
.sw::after{content:'';position:absolute;top:3px;left:17px;width:14px;height:14px;border-radius:50%;background:#fff}
.cap{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#555}
</style>
</helmet>
<div style="display: flex; gap: 40px; padding: 40px; box-sizing: border-box; min-height: 100vh; background: #d6d6d6; font-family: Lato, -apple-system, sans-serif; align-items: flex-start; justify-content: center">

<div style="display: flex; flex-direction: column; gap: 10px">
<span class="cap">Desktop · menu open</span>
<div style="position: relative; width: 1120px; height: 680px; border-radius: 10px; overflow: hidden; background: #e9e9e9 url('/_blob/109a2bd8698141144c1b6c8556e0f67d') center / cover no-repeat; box-shadow: 0 10px 30px rgba(0,0,0,0.15)">
<button class="mb open" aria-label="Menu" aria-expanded="true" style="position: absolute; right: 20px; top: 20px"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.x}}"></path></svg></button>
<div class="menu" role="menu" style="right: 20px; top: 72px">
<div class="it" role="menuitemcheckbox" aria-checked="true"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.sound}}"></path></svg>Sound<span class="sw"></span></div>
<div class="it" role="menuitem"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.help}}"></path></svg>How to move around</div>
<span style="height: 1px; background: #eeeeee; margin: 4px 8px"></span>
<div class="it" role="menuitem"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.exit}}"></path></svg>Leave exhibition</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="cap">Closed: the only button on screen</span>
<div style="position: relative; width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: #e9e9e9 url('/_blob/109a2bd8698141144c1b6c8556e0f67d') right top / 1120px auto no-repeat; box-shadow: 0 6px 20px rgba(0,0,0,0.12)">
<button class="mb" aria-label="Menu" style="position: absolute; right: 20px; top: 20px"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.list}}"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="cap">Phone · menu open</span>
<div style="position: relative; width: 300px; height: 560px; border-radius: 28px; overflow: hidden; background: #e9e9e9 url('/_blob/109a2bd8698141144c1b6c8556e0f67d') 55% center / auto 100% no-repeat; box-shadow: 0 10px 30px rgba(0,0,0,0.15)">
<button class="mb open" aria-label="Menu" aria-expanded="true" style="position: absolute; right: 14px; top: 44px"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.x}}"></path></svg></button>
<div class="menu" style="right: 14px; top: 96px; width: 230px">
<div class="it"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.sound}}"></path></svg>Sound<span class="sw"></span></div>
<div class="it"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.help}}"></path></svg>How to move around</div>
<span style="height: 1px; background: #eeeeee; margin: 4px 8px"></span>
<div class="it"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="{{ic.exit}}"></path></svg>Leave exhibition</div>
</div>
</div>
</div>
</div>

</div>
