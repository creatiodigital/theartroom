<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall View</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#e2e2e2}</style>
</helmet>
<div style="position: relative; display: flex; width: 100%; height: 100vh; min-height: 900px; overflow: hidden; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; color: #333333; background: #e2e2e2">

<aside aria-label="Wall options" style="flex: 0 0 320px; height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e6e6e6; display: flex; flex-direction: column">

<header style="padding: 18px 16px 14px; border-bottom: 1px solid #efefef; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #999999">Editing wall</span><h1 style="margin: 0; font-size: 18px; font-weight: 700; color: #000000">Quimigramas · 1303 cm</h1></div>
<div style="display: flex; gap: 6px">
<button type="button" title="Discard all changes and exit" style="font: inherit; font-size: 13px; font-weight: 600; padding: 0 12px; height: 38px; background: none; border: 0; border-radius: 8px; color: #555555">Cancel</button>
<button type="button" title="Save all changes and continue editing" style="font: inherit; font-size: 13px; font-weight: 600; padding: 0 14px; height: 38px; background: #ffffff; border: 1px solid #dcdcdc; border-radius: 8px">Save</button>
<button type="button" title="Save all changes and exit" style="flex: 1 1 auto; font: inherit; font-size: 13px; font-weight: 600; height: 38px; background: #1a1a1a; color: #ffffff; border: 0; border-radius: 8px">Save &amp; close</button>
</div>
</header>

<div style="flex: 1 1 auto; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 4px; padding: 4px; background: #f5f5f5; border-radius: 10px">
<button type="button" aria-label="Undo (⌘Z)" style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 0; border-radius: 7px; color: #333333; box-shadow: 0 1px 2px rgba(0,0,0,0.06)"><svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.undo}}"></path></svg></button>
<button type="button" aria-label="Redo (⌘⇧Z)" disabled style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 7px; color: #bbbbbb"><svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.redo}}"></path></svg></button>
<span aria-hidden="true" style="width: 1px; height: 20px; background: #dddddd; margin: 0 4px"></span>
<button type="button" aria-label="Zoom out" style="width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #333333"><svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.minus}}"></path></svg></button>
<span aria-live="polite" style="font-family: 'Geist Mono', monospace; font-size: 12px; min-width: 40px; text-align: center; color: #000000">35%</span>
<button type="button" aria-label="Zoom in" style="width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #333333"><svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></button>
<button type="button" style="margin-left: auto; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 600; padding: 0 10px; height: 34px; background: #ffffff; border: 0; border-radius: 7px; box-shadow: 0 1px 2px rgba(0,0,0,0.06)"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.fit}}"></path></svg>Fit</button>
</div>

<section aria-labelledby="h-help" style="display: flex; flex-direction: column; gap: 2px">
<h2 id="h-help" style="margin: 0 4px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #666666">Helpers</h2>
<sc-for list="{{helpers}}" as="h" hint-placeholder-count="4">
<label style="{{h.row}}">
<span aria-hidden="true" style="{{h.tile}}"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="{{h.icon}}"></path></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13px; font-weight: 500">{{h.label}}</span><span style="font-size: 11.5px; color: #888888">{{h.sub}}</span></span>
<span role="switch" aria-checked="{{h.checked}}" aria-label="{{h.label}}" style="{{h.sw}}"><span style="{{h.knob}}"></span></span>
</label>
</sc-for>
</section>

<section aria-labelledby="h-items" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px"><h2 id="h-items" style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #666666">On this wall</h2><span style="font-size: 12px; color: #888888">8 items</span></div>
<div role="group" aria-label="Show" style="display: flex; gap: 4px; padding: 3px; background: #f5f5f5; border-radius: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button type="button" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<li><button type="button" aria-current="{{it.cur}}" style="{{it.row}}">
<sc-if value="{{it.img}}" hint-placeholder-val="{{false}}"><img src="{{it.img}}" alt="" style="width: 36px; height: 27px; object-fit: cover; border-radius: 3px; flex: 0 0 auto"></sc-if>
<sc-if value="{{it.icon}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 36px; height: 27px; flex: 0 0 auto; border-radius: 3px; background: #f2f2f2; display: flex; align-items: center; justify-content: center; color: #666666"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="{{it.icon}}"></path></svg></span></sc-if>
<span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.name}}</span>
<span style="font-size: 11px; color: #999999">{{it.kind}}</span>
</button></li>
</sc-for>
</ul>
</section>

<section aria-labelledby="h-groups" style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid #f0f0f0">
<div style="display: flex; align-items: center; justify-content: space-between; margin: 8px 4px 0"><h2 id="h-groups" style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #666666">Autofocus groups</h2>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 12px; font-weight: 600; padding: 4px 8px; background: none; border: 1px solid #dcdcdc; border-radius: 6px"><svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>New group</button></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; background: #f7f7f7; border-radius: 8px">
<span style="display: flex; margin-right: 2px"><img src="/_blob/4b57b147d3838c013ed716443b2e427a" alt="" style="width: 24px; height: 18px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 2px #f7f7f7"><img src="/_blob/0c144ad2600749008030888c3edfb22a" alt="" style="width: 24px; height: 18px; object-fit: cover; border-radius: 2px; margin-left: -8px; box-shadow: 0 0 0 2px #f7f7f7"></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13px; font-weight: 600; color: #000000">Group 1</span><span style="font-size: 11.5px; color: #888888">2 works</span></span>
<button type="button" aria-label="Show group 1 outline" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #666666"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.eyeSlash}}"></path></svg></button>
<button type="button" aria-label="Remove group 1" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #666666"><svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.x}}"></path></svg></button>
</div>
</section>

</div>
</aside>

<main aria-label="Wall" style="position: relative; flex: 1 1 auto; height: 100%; background: #e2e2e2 url('/_blob/7a30a11bd2d537d6002a22ad830cd214') left top / 1120px auto no-repeat">

<nav aria-label="Add to the wall" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: #ffffff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04)">
<button type="button" title="Add artwork from your library" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; font-weight: 600; padding: 0 14px 0 12px; height: 52px; background: #1a1a1a; color: #ffffff; border: 0; border-radius: 10px"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{ic.library}}"></path></svg>From library</button>
<span aria-hidden="true" style="width: 1px; height: 32px; background: #ececec; margin: 0 6px"></span>
<sc-for list="{{adds}}" as="a" hint-placeholder-count="5">
<button type="button" draggable="true" title="{{a.tip}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 58px; height: 52px; font: inherit; background: none; border: 0; border-radius: 10px; color: #333333; cursor: grab"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="{{a.icon}}"></path></svg><span style="font-size: 11px; font-weight: 500">{{a.label}}</span></button>
</sc-for>
</nav>
<span style="position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 11px; color: #777777; white-space: nowrap">Click to add in the middle of the wall, or drag onto the wall.</span>
</main>

</div>
</x-dc>
